name: Anylinux-AppImage
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
on:
  schedule:
    - cron: "0 7 1/11 * *" # We default to rebuilding every 21 days, change this to your liking
  workflow_dispatch: {}

jobs:
  build:
    name: "${{ matrix.name }} (${{ matrix.channel }}, ${{ matrix.arch }})"
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        channel: [stable, beta, canary]
        arch: [x86_64, aarch64]
        include:
          - runs-on: ubuntu-latest
            name: Build AppImage
            arch: x86_64
          # comment out these 3 lines if aarch64 is not wanted
          - runs-on: ubuntu-24.04-arm
            name: Build AppImage
            arch: aarch64
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparing Container
        uses: pkgforge-dev/anylinux-setup-action@0964f2258d6c93d1391359978dde081fd8b3c6af # v2
      - name: Install Dependencies
        run: /bin/sh ./get-dependencies.sh
        env:
          CHROME_CHANNEL: ${{ matrix.channel }}
      - name: Make AppImage
        run: /bin/sh ./make-appimage.sh
        env:
          CHROME_CHANNEL: ${{ matrix.channel }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AppImage-${{ matrix.channel }}-${{ matrix.arch }}
          path: dist

  release:
    if: ${{ github.ref_name == 'main' }}
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AppImage-*
          merge-multiple: true
      - name: Save channel versions
        run: |
          STABLE_VER=$(ls Google_Chrome-[0-9]*.AppImage 2>/dev/null | head -n1 | sed -E 's/Google_Chrome-([0-9.]+)-anylinux.*/\1/')
          BETA_VER=$(ls Google_Chrome_Beta-*.AppImage 2>/dev/null | head -n1 | sed -E 's/Google_Chrome_Beta-([0-9.]+)-anylinux.*/\1/')
          CANARY_VER=$(ls Google_Chrome_Canary-*.AppImage 2>/dev/null | head -n1 | sed -E 's/Google_Chrome_Canary-([0-9.]+)-anylinux.*/\1/')
          echo "STABLE_VER=$STABLE_VER" >> "$GITHUB_ENV"
          echo "BETA_VER=$BETA_VER" >> "$GITHUB_ENV"
          echo "CANARY_VER=$CANARY_VER" >> "$GITHUB_ENV"
      - name: Release AppImage
        uses: pkgforge-dev/make-stable-appimage-release@4ed3d48ccb065352b6e6c0db6d39885b201c54a0 #v1.1
      - name: Update README download links
        run: |
          [ -z "$STABLE_VER" ] && [ -f ./LATEST_VERSION ] && STABLE_VER=$(cat ./LATEST_VERSION)
          [ -n "$STABLE_VER" ] && sed -i -E "s/Google_Chrome-[0-9.]+-anylinux/Google_Chrome-${STABLE_VER}-anylinux/g" README.md
          [ -n "$BETA_VER" ] && sed -i -E "s/Google_Chrome_Beta-[0-9.]+-anylinux/Google_Chrome_Beta-${BETA_VER}-anylinux/g" README.md
          [ -n "$CANARY_VER" ] && sed -i -E "s/Google_Chrome_Canary-[0-9.]+-anylinux/Google_Chrome_Canary-${CANARY_VER}-anylinux/g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "update README download links [skip ci]" && git push)
